name: Заведения для Орала (OSM + Overture)
on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1'   # каждый понедельник
  push:
    branches: [main, cities]
    paths:
      - '.github/workflows/oral.yml'
permissions:
  contents: write
jobs:
  places:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: BBOX="51.13,51.22,51.31,51.52" python scripts/osm_places.py data/osm-places-oral.json
      - run: pip install overturemaps
      - run: overturemaps download --bbox=51.22,51.13,51.52,51.31 -f geojson --type=place -o /tmp/places-oral.geojson
      - run: python scripts/overture_places.py /tmp/places-oral.geojson data/places-oral.json
      - name: Сохранить в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase -q origin ${GITHUB_REF_NAME}
          git add data/osm-places-oral.json data/places-oral.json
          git diff --cached --quiet || (git commit -m "Обновлены заведения для Орала" && git push origin HEAD:${GITHUB_REF_NAME})
